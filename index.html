<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADA Solution Finder – prototype</title>
<script>/* Apply a saved theme before first paint to avoid a flash */try{const m=localStorage.getItem("ada-theme");if(m==="light"||m==="dark")document.documentElement.dataset.theme=m;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Design tokens – approximated from adaglobal.com (navy, cyan, blue). Replace with exact brand hex values when the design team delivers the UI.
   --accent: selected states, links, bars · --accent-2: second accent, gradient start · --cta-*: primary button (ADA cyan in both themes). */
:root{
  --ink:#0A1733; --accent:#2F50D8; --accent-2:#0B7FA3; --on-accent:#FFFFFF; --surface:#FFFFFF; --page:#F2F6FC;
  --line:#D5DFEE; --text:#14203A; --muted:#55627D; --chip:#E7F0FB; --ok:#178A5B; --warn:#B4541A; --danger:#C2334D;
  --cta-a:#3FE0FF; --cta-b:#8FB7FF; --on-cta:#04132B;
  --radius-lg:22px; --radius-sm:10px;
  --font:Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-head:"Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EAF4FF; --accent:#3FE0FF; --accent-2:#8C8CFF; --on-accent:#04132B; --surface:#0A1A38; --page:#031027;
    --line:#1E3155; --text:#E3ECF8; --muted:#9AAAC6; --chip:#12254A; --ok:#4CC793; --warn:#F09A5B; --danger:#FF7A8A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#EAF4FF; --accent:#3FE0FF; --accent-2:#8C8CFF; --on-accent:#04132B; --surface:#0A1A38; --page:#031027;
  --line:#1E3155; --text:#E3ECF8; --muted:#9AAAC6; --chip:#12254A; --ok:#4CC793; --warn:#F09A5B; --danger:#FF7A8A;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--page);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55;min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;border-radius:6px}
/* Headings get focus on screen change for screen readers; no ring needed there */
[tabindex="-1"]:focus{outline:none}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--page);background:color-mix(in srgb,var(--page) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#bg-dots{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--page)}
.bar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;gap:12px}
.brand{font-weight:700;letter-spacing:-.02em;font-size:1.15rem;color:var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;min-width:0}
.brand span{font-weight:500;color:var(--muted);font-size:.95rem}
.brand .proto{font-family:var(--font);font-size:.72rem;font-weight:600;letter-spacing:.02em;color:var(--accent);background:var(--chip);border-radius:999px;padding:2px 9px}
.logo{display:inline-flex;color:var(--ink);padding:4px 2px}
.logo svg{height:26px;width:auto;display:block}
.theme-btn{flex:none;width:40px;height:40px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:border-color .15s}
.theme-btn:hover{border-color:var(--accent)}

main{max-width:880px;margin:0 auto;padding:28px 20px 64px}
.steps{display:flex;gap:6px;margin:0 0 22px;padding:0;list-style:none;flex-wrap:wrap}
.steps li{flex:1 1 0;min-width:90px;font-size:.8rem;color:var(--muted)}
.steps li::before{content:"";display:block;height:4px;border-radius:4px;background:var(--line);margin-bottom:6px}
.steps li.done::before,.steps li.now::before{background:var(--accent)}
.steps li.now{color:var(--text);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:32px}
h1{font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 14px;color:var(--ink);font-weight:700;max-width:20ch}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  h1{background:linear-gradient(90deg,var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
}
h1,h2,h3,.brand{font-family:var(--font-head)}
h2{font-size:1.5rem;line-height:1.2;letter-spacing:-.015em;margin:0 0 6px;color:var(--ink);font-weight:700}
p.lead{font-size:1.1rem;color:var(--muted);max-width:56ch;margin:0 0 24px}
.q{margin:26px 0 0;border:0;padding:0}
.q legend{font-weight:600;margin-bottom:10px;padding:0}
.q .hint{font-weight:400;color:var(--muted);font-size:.88rem;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.95rem;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.err{color:var(--danger);font-size:.88rem;margin-top:6px;min-height:1em}

.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:13px 26px;font-weight:600;cursor:pointer;font-size:1rem}
.btn.primary{background:linear-gradient(90deg,var(--cta-a),var(--cta-b));color:var(--on-cta)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;color:var(--muted);padding-left:4px}
.btn.ghost:hover{color:var(--text)}

/* Intro */
.intro{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center}
.intro-visual{position:relative;aspect-ratio:1/1;max-width:300px;justify-self:center;width:100%}
.intro-visual svg{width:100%;height:100%}
/* Understand: a plain list with small outlined markers joined by a thin gradient rule */
.needs{margin:4px 0 0;padding:0;list-style:none}
.needs li{position:relative;display:grid;grid-template-columns:34px 1fr;gap:16px;align-items:start;padding:10px 0 18px}
.needs li:not(:last-child)::after{content:"";position:absolute;left:16px;top:50px;bottom:-4px;width:2px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent-2));opacity:.3}
.needs .ic{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--accent);background:var(--surface)}
.needs .ic svg{width:16px;height:16px}
.needs b{display:block;color:var(--ink);margin-top:5px}
.needs span{color:var(--muted)}

/* Confirm */
dl.sum{display:grid;grid-template-columns:minmax(150px,240px) 1fr;margin:18px 0 0;border-top:1px solid var(--line)}
dl.sum dt,dl.sum dd{padding:11px 0;border-bottom:1px solid var(--line);margin:0}
dl.sum dt{color:var(--muted);padding-right:16px}
.sum-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px}
.sum-head h3{margin:0;font-size:1.05rem;color:var(--ink)}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:24px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}

/* Results */
.top{text-align:center;padding:10px 0 26px;border-bottom:1px solid var(--line)}
.ring{width:190px;height:190px;margin:8px auto 6px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:2.6rem;color:var(--ink);letter-spacing:-.03em}
.ring .pct small{display:block;font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:-6px}
.top .tag{display:inline-block;background:var(--chip);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:600}
.top h2{font-size:clamp(1.6rem,4vw,2.1rem);margin:12px 0 4px}
.top .best{color:var(--muted);margin:0 auto 14px;max-width:52ch}
.fee{font-size:1.35rem;font-weight:700;color:var(--ink)}
.fee small{display:block;font-size:.85rem;font-weight:500;color:var(--muted)}
.incl{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:16px auto 0;max-width:600px;padding:0;list-style:none}
.incl li{font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.budget{margin-top:14px;font-size:.92rem;font-weight:600}
.budget.ok{color:var(--ok)} .budget.no{color:var(--warn)}
.others{list-style:none;padding:0;margin:18px 0 0}
.others li{display:grid;grid-template-columns:1fr 150px 56px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.others .nm b{display:block;color:var(--ink)}
.others .nm span{font-size:.88rem;color:var(--muted)}
.others .bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.others .bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.others .p{font-weight:700;text-align:right;color:var(--ink)}
.others li.pick .nm b{color:var(--accent)}
.others li.pick .bar i{background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.others em{font-style:normal;font-weight:600;color:var(--accent-2)}
.incl li b{color:var(--accent);margin-right:2px}
.oneoff{font-size:.92rem;color:var(--muted);margin-top:6px}
.notes{list-style:none;padding:0;margin:14px auto 0;max-width:52ch;font-size:.88rem;color:var(--muted)}
.notes li+li{margin-top:2px}
h3.areas-h{margin:26px 0 0;color:var(--ink);font-size:1.1rem}
h3.area{margin:18px 0 0;font-size:.82rem;font-family:var(--font);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h3.area+.others{margin-top:4px}
.sub{color:var(--muted);font-size:.92rem;margin:4px 0 0}
/* Explore cards: each opens on its own; align-items:start keeps closed neighbours from stretching */
.ex-grid{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;align-items:start}
.ex{border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--chip) 45%,var(--surface));transition:border-color .15s}
.ex:hover,.ex[open]{border-color:var(--accent)}
.ex summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:14px 16px}
.ex summary::-webkit-details-marker{display:none}
.ex summary::after{content:"+";grid-column:2;grid-row:1 / span 2;align-self:center;font-size:1.3rem;line-height:1;color:var(--accent)}
.ex[open] summary::after{content:"−"}
.ex-area{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ex b{color:var(--ink)}
/* Closed cards share one height: long labels end in "…" and show in full once the card is opened */
.ex .ex-area,.ex b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex[open] .ex-area,.ex[open] b{white-space:normal}
.ex p{margin:0 16px;color:var(--muted);font-size:.9rem}
.ex-rate{display:block;margin:8px 16px 14px;font-size:.82rem;font-weight:600;color:var(--accent)}
/* Add-ons / ALC rates: collapsed by default */
details.alc{margin-top:26px;border:1px solid var(--line);border-radius:14px;padding:0 16px}
details.alc summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;font-family:var(--font-head);font-weight:700;color:var(--ink)}
details.alc summary::-webkit-details-marker{display:none}
details.alc summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--accent)}
details.alc[open] summary::after{content:"−"}
details.alc .sub{margin:0}
.tbl{overflow-x:auto;margin:10px 0 16px}
.tbl table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:540px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:9px 12px 9px 0;border-top:1px solid var(--line)}
.tbl thead th{border-top:0;font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tbl tbody th{font-weight:600;color:var(--ink)}
.tbl td{color:var(--muted)}
.tbl td.num{white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums}
/* Phones: each rate becomes a stacked row (name / rate + unit / note) instead of a sideways-scrolling table */
@media (max-width:680px){
  .tbl{overflow:visible}
  .tbl table,.tbl tbody,.tbl tr,.tbl tbody th{display:block;min-width:0}
  .tbl thead{display:none}
  .tbl tr{padding:11px 0;border-top:1px solid var(--line)}
  .tbl th,.tbl td{border:0;padding:0}
  .tbl td{display:inline}
  .tbl td.num{font-weight:600;white-space:normal}
  .tbl td:nth-of-type(2)::before{content:" · "}
  .tbl td:nth-of-type(3){display:block;font-size:.85rem;margin-top:2px}
}
.disc{font-size:.85rem;color:var(--muted);margin-top:18px}

/* Consult */
.field{margin-top:18px;max-width:420px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface)}
.field input:focus{border-color:var(--accent);outline:none}
.field.other{margin-top:12px;max-width:320px}
.field.other label{font-weight:500;font-size:.9rem;color:var(--muted)}
.reveal{overflow:hidden}
.hidden{display:none}
.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}

/* Booking */
.book{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.book-h{margin:0;font-size:1.15rem;color:var(--ink)}
.book-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:28px;margin-top:16px;align-items:start}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{color:var(--ink);font-weight:600}
.cal-nav{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:1.15rem;line-height:1}
.cal-nav:not(:disabled):hover{border-color:var(--accent)}
.cal-nav:disabled{opacity:.35;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-grid .wd{font-size:.75rem;font-weight:600;color:var(--muted);padding:4px 0}
.day{width:100%;max-width:40px;height:40px;margin:0 auto;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;font-size:.92rem;color:var(--text);font-variant-numeric:tabular-nums}
.day:not(:disabled):hover{background:var(--chip)}
.day:disabled{color:var(--muted);opacity:.4;cursor:default}
.day.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.slots-h{margin:4px 0 12px;font-weight:600;color:var(--ink)}
.slot-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 10px;cursor:pointer;font-size:1rem;font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s}
.slot:hover{border-color:var(--accent)}
.slot.on{background:var(--cta-a);border-color:var(--cta-a);color:var(--on-cta);font-weight:700}
.booked{display:inline-block;margin:18px 0 0;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600}
@media (max-width:680px){.book-grid{grid-template-columns:minmax(0,1fr);gap:20px}}

/* Done */
.done{text-align:center;padding:24px 0}
.done .mark{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--ok)}
.done h1{margin:0 auto 10px}
.done p{color:var(--muted);max-width:50ch;margin:0 auto 26px}

.intro .note{font-size:.85rem;color:var(--muted);max-width:52ch;margin:-12px 0 20px}
footer.site{max-width:880px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.92rem}
footer.site a{color:var(--accent);font-weight:600}
.done .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.done a.btn{text-decoration:none;display:inline-block}
@media (max-width:680px){
  .panel{padding:22px}
  .intro{grid-template-columns:1fr}
  .intro-visual{max-width:200px;order:-1}
  dl.sum{grid-template-columns:1fr}
  dl.sum dt{border-bottom:0;padding-bottom:0}
  .others li{grid-template-columns:1fr 50px}
  .others .bar{grid-column:1 / -1;order:3}
}
/* Intro rings: rotation lives in CSS so the draw-in animation can spin them into place */
.intro-visual .arc{transform-box:view-box;transform-origin:100px 100px;transform:rotate(-90deg)}
.intro-visual .arc-a{--len:420}
.intro-visual .arc-b{--len:230}
@keyframes arc-draw{
  0%{stroke-dashoffset:var(--len);transform:rotate(-300deg);opacity:0}
  12%{opacity:1}
  100%{stroke-dashoffset:0;transform:rotate(-90deg);opacity:1}
}
@media (prefers-reduced-motion:no-preference){
  .ring circle.val{transition:stroke-dashoffset 900ms cubic-bezier(.2,.8,.2,1)}
  .intro-visual .arc{animation:arc-draw 1.8s cubic-bezier(.22,1,.36,1) both}
  .intro-visual .arc-b{animation-delay:.18s;animation-duration:1.6s}
}
</style>
</head>

        <path d="M96.1523 30.7266V42.2639" stroke="currentColor" stroke-width="7.69231" stroke-miterlimit="10" stroke-linecap="round"/>

/* Rule D: 70% × share of the brand's needs covered + 30% × share of the option used */
const fit=(covers,needs)=>{if(!needs.length) return 0;const hit=covers.filter(c=>needs.includes(c)).length;return .7*hit/needs.length+.3*hit/covers.length;};
/* Display calibration (monotone, keeps the ranking): a raw fit in the 60s reads as ~75%,
   strong fits stay close to their raw value, and nothing shows a flat 100%. */
const CAL=[[0,30],[.5,70],[.9,90],[1,98]];
function calibrate(r){
  for(let i=1;i<CAL.length;i++){const [x0,y0]=CAL[i-1],[x1,y1]=CAL[i];if(r<=x1) return Math.round(y0+(y1-y0)*(r-x0)/(x1-x0));}
  return 98;
}
const sessions=()=>A.live==="other"?(+A.liveOther||0):(+A.live||0);
const videos=()=>A.video==="other"?(+A.videoOther||0):(+A.video||0);
function compute(){

      const raw=a.pickOne?fit(o.covers,needs):(o.covers.some(c=>needs.includes(c))?1:0);
      return {o,raw,pct:raw>0?calibrate(raw):0};
    }).sort((x,y)=>y.raw-x.raw);
    const chosen=!needs.length?[]:a.pickOne?[opts[0]]:opts.filter(x=>x.raw>0);
    return {a,needs,opts,chosen,raw:!needs.length?0:a.pickOne?opts[0].raw:1};
  });
  const areas=all.filter(x=>x.needs.length);
  const ids=areas.flatMap(x=>x.chosen.map(c=>c.o.id));
  let from=0,to=0;
  if(has("live")){const h=sessions()*RATE.hrsPerSession;from+=h*RATE.liveHr[0];to+=h*RATE.liveHr[1];}
  if(has("video")){const v=videos();from+=v*RATE.video[0];to+=v*RATE.video[1];}
  if(has("ads")||has("aff")){const m=MEDIA_RANGE[A.media]||[0,0];from+=m[0]*RATE.mediaFee;to+=m[1]*RATE.mediaFee;}
  const st=areas.find(x=>x.a.id==="store");
  if(st){const g=GMV_RANGE[+A.gmv]||[0,0],fix=st.chosen.length*RATE.store;from+=fix+RATE.commission*g[0];to+=fix+RATE.commission*g[1];}

  from=Math.round(from); to=Math.round(to);
  const raw=areas.length?areas.reduce((s,x)=>s+x.raw,0)/areas.length:0;
  return {all,areas,ids,score:areas.length?Math.max(75,calibrate(raw)):0,from,to,oneOff,fits:+A.bud>=from};
}

/* ---------- Validation ---------- */
function need(key,multi){
  const ok=multi?A[key].length>0:A[key]!==null;
  const e=document.getElementById("e-"+key); if(e) e.textContent=ok?"":(multi?t("reqM"):t("req"));
  return ok;
}
function needOther(key){
  if(A[key]!=="other") return true;
  const num=OTHER[key][2], v=A[key+"Other"].trim();
  const ok=num?/^\d+$/.test(v)&&+v>0:v.length>0;
  const e=document.getElementById("e-"+key); if(e) e.textContent=ok?"":(num?t("numErr"):t("otherErr"));
  return ok;
}
function validate(step){
  if(step==="s1"){const r=["cat","ch","gmv","tgt","sku"].map(k=>need(k,k==="ch"));if(r[0]) r[0]=needOther("cat");return r.every(Boolean);}
  if(step==="s2"){
    const r=[need("svc",true)];
    if(shown("live")) r.push(need("live")&&needOther("live"));
    if(shown("video")) r.push(need("video")&&needOther("video"));
    if(shown("media")) r.push(need("media"));
    r.push(need("dur")&&needOther("dur"),need("bud"),need("start"));
    return r.every(Boolean);
  }
  if(step==="confirm"){A.confirmed=$("#cfok").checked;$("#e-cf").textContent=A.confirmed?"":t("cfErr");return A.confirmed;}
  if(step==="consult"){
    if(!A.wants) return true;
    A.email=$("#email").value.trim(); A.consent=$("#consent").checked; A.consentTime=A.consent?new Date().toISOString():"";
    const okE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(A.email); const okC=A.consent; const okB=!!(A.callDate&&A.callTime);
    $("#e-email").textContent=okE?"":t("emailErr"); $("#e-consent").textContent=okC?"":t("consentErr"); $("#e-book").textContent=okB?"":t("bkErr");
    if(!okE) $("#email").focus(); return okE&&okC&&okB;
  }
  return true;
}

/* ---------- Dot-wave background ----------
   A dot grid warped by a slow wave field. Dots grow and brighten on the crests and
   fade in the troughs; colour runs between the two accent colours like the brand gradient. */
(function(){
  const cv=$("#bg-dots"), ctx=cv&&cv.getContext("2d");
  if(!ctx) return;
  const still=matchMedia("(prefers-reduced-motion: reduce)");
  const BUCKETS=12;
  let W=0,H=0,gap=22,dark=false,cols=[],raf=0,last=0;
  const hex=v=>{v=v.trim().replace("#","");return [0,2,4].map(i=>parseInt(v.slice(i,i+2),16));};
  function readColors(){
    const s=getComputedStyle(document.documentElement);
    const a=hex(s.getPropertyValue("--accent")),b=hex(s.getPropertyValue("--accent-2")),p=hex(s.getPropertyValue("--page"));
    dark=(p[0]*.299+p[1]*.587+p[2]*.114)<128;
    cols=[...Array(BUCKETS)].map((_,i)=>{const f=i/(BUCKETS-1);return `rgb(${a.map((c,j)=>Math.round(c+(b[j]-c)*f)).join(",")})`;});
  }
  function size(){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    W=innerWidth; H=innerHeight; gap=W<680?18:22;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function draw(t){
    const s=t*0.00022, amp=gap*0.7, base=dark?0.1:0.07, gain=dark?0.8:0.5, rMax=dark?1.7:1.5;
    ctx.clearRect(0,0,W,H);
    for(let y=-gap;y<H+gap;y+=gap){
      const ny=y/H;
      for(let x=-gap;x<W+gap;x+=gap){
        const nx=x/W;
        const h=Math.sin(nx*5.2+s*1.3+Math.sin(ny*3.1-s)*1.6)*Math.cos(ny*4.4-s*0.9+nx*1.7);
        const k=(h+1)/2, e=k*k*(3-2*k);
        ctx.globalAlpha=base+e*e*gain;
        ctx.fillStyle=cols[Math.max(0,Math.min(BUCKETS-1,Math.floor((nx*0.7+ny*0.3)*BUCKETS)))];
        ctx.beginPath();
        ctx.arc(x+Math.cos(ny*6+s)*amp*h, y+Math.sin(nx*6-s)*amp*h, 0.45+e*rMax, 0, 6.2832);
        ctx.fill();
      }
    }
  }
  /* ~30 fps is plenty for a slow drift and keeps the page light */
  function loop(t){raf=requestAnimationFrame(loop); if(t-last<33) return; last=t; draw(t);}
  function start(){cancelAnimationFrame(raf); if(still.matches||document.hidden){draw(0);return;} raf=requestAnimationFrame(loop);}
  readColors(); size(); start();
  let pending=0;
  addEventListener("resize",()=>{cancelAnimationFrame(pending);pending=requestAnimationFrame(()=>{size();if(still.matches)draw(0);});});
  document.addEventListener("visibilitychange",start);
  still.addEventListener("change",start);
  const recolor=()=>{readColors();if(still.matches)draw(0);};
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",recolor);
  new MutationObserver(recolor).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
})();

render();
log("page_view");
</script>
</body>
</html>
