<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADA Solution Finder – prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Design tokens – approximated ADA palette. Replace with exact brand hex values when the design team delivers the UI. */
:root{
  --ink:#1B1540; --violet:#5A3FD8; --magenta:#E0357F; --surface:#FFFFFF; --page:#F4F2FB;
  --line:#DCD6F0; --text:#221D3B; --muted:#62597F; --chip:#EFEBFC; --ok:#178A5B; --warn:#B4541A;
  --radius-lg:22px; --radius-sm:10px;
  --font:Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-head:"Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDE9FF; --violet:#9C86FF; --magenta:#FF6FA8; --surface:#1C1833; --page:#120F24;
    --line:#352E58; --text:#ECE9F7; --muted:#AFA7CC; --chip:#2A2448; --ok:#4CC793; --warn:#F09A5B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#EDE9FF; --violet:#9C86FF; --magenta:#FF6FA8; --surface:#1C1833; --page:#120F24;
  --line:#352E58; --text:#ECE9F7; --muted:#AFA7CC; --chip:#2A2448; --ok:#4CC793; --warn:#F09A5B;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--page);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55;min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--magenta);outline-offset:2px;border-radius:6px}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--page);background:color-mix(in srgb,var(--page) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#bg-dots{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--page)}
.bar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;gap:12px}
.brand{font-weight:700;letter-spacing:-.02em;font-size:1.15rem;color:var(--ink)}
.brand span{font-weight:500;color:var(--muted);margin-left:8px;font-size:.95rem}

main{max-width:880px;margin:0 auto;padding:28px 20px 64px}
.steps{display:flex;gap:6px;margin:0 0 22px;padding:0;list-style:none;flex-wrap:wrap}
.steps li{flex:1 1 0;min-width:90px;font-size:.8rem;color:var(--muted)}
.steps li::before{content:"";display:block;height:4px;border-radius:4px;background:var(--line);margin-bottom:6px}
.steps li.done::before,.steps li.now::before{background:var(--violet)}
.steps li.now{color:var(--text);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:32px}
h1{font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 14px;color:var(--ink);font-weight:700;max-width:20ch}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  h1{background:linear-gradient(90deg,var(--magenta),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
}
h1,h2,h3,.brand{font-family:var(--font-head)}
h2{font-size:1.5rem;line-height:1.2;letter-spacing:-.015em;margin:0 0 6px;color:var(--ink);font-weight:700}
p.lead{font-size:1.1rem;color:var(--muted);max-width:56ch;margin:0 0 24px}
.q{margin:26px 0 0;border:0;padding:0}
.q legend{font-weight:600;margin-bottom:10px;padding:0}
.q .hint{font-weight:400;color:var(--muted);font-size:.88rem;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.95rem;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--violet)}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.err{color:var(--magenta);font-size:.88rem;margin-top:6px;min-height:1em}

.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:13px 26px;font-weight:600;cursor:pointer;font-size:1rem}
.btn.primary{background:linear-gradient(90deg,var(--magenta),var(--violet));color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;color:var(--muted);padding-left:4px}
.btn.ghost:hover{color:var(--text)}

/* Intro */
.intro{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center}
.intro-visual{position:relative;aspect-ratio:1/1;max-width:300px;justify-self:center;width:100%}
.intro-visual svg{width:100%;height:100%}
.facts{display:flex;gap:22px;margin:22px 0 28px;flex-wrap:wrap;color:var(--muted);font-size:.95rem}
.facts b{display:block;color:var(--ink);font-size:1.05rem}

/* Understand */
.needs{display:grid;gap:14px;margin:8px 0 0;padding:0;list-style:none}
.needs li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.needs li:last-child{border-bottom:0}
.needs .ic{width:44px;height:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--violet)}
.needs b{display:block;color:var(--ink)}
.needs span{color:var(--muted)}

/* Confirm */
dl.sum{display:grid;grid-template-columns:minmax(150px,240px) 1fr;margin:18px 0 0;border-top:1px solid var(--line)}
dl.sum dt,dl.sum dd{padding:11px 0;border-bottom:1px solid var(--line);margin:0}
dl.sum dt{color:var(--muted);padding-right:16px}
.sum-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px}
.sum-head h3{margin:0;font-size:1.05rem;color:var(--ink)}
.link{background:none;border:0;color:var(--violet);font-weight:600;cursor:pointer;padding:4px}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:24px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--violet);flex:none}

/* Results */
.top{text-align:center;padding:10px 0 26px;border-bottom:1px solid var(--line)}
.ring{width:190px;height:190px;margin:8px auto 6px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:2.6rem;color:var(--ink);letter-spacing:-.03em}
.ring .pct small{display:block;font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:-6px}
.top .tag{display:inline-block;background:var(--chip);color:var(--violet);border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:600}
.top h2{font-size:clamp(1.6rem,4vw,2.1rem);margin:12px 0 4px}
.top .best{color:var(--muted);margin:0 auto 14px;max-width:52ch}
.fee{font-size:1.35rem;font-weight:700;color:var(--ink)}
.fee small{display:block;font-size:.85rem;font-weight:500;color:var(--muted)}
.incl{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:16px auto 0;max-width:600px;padding:0;list-style:none}
.incl li{font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.budget{margin-top:14px;font-size:.92rem;font-weight:600}
.budget.ok{color:var(--ok)} .budget.no{color:var(--warn)}
.others{list-style:none;padding:0;margin:18px 0 0}
.others li{display:grid;grid-template-columns:1fr 150px 56px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.others .nm b{display:block;color:var(--ink)}
.others .nm span{font-size:.88rem;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--violet);border-radius:8px}
.others .p{font-weight:700;text-align:right;color:var(--ink)}
.disc{font-size:.85rem;color:var(--muted);margin-top:18px}

/* Consult */
.field{margin-top:18px;max-width:420px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface)}
.field input:focus{border-color:var(--violet);outline:none}
.reveal{overflow:hidden}
.hidden{display:none}

/* Done */
.done{text-align:center;padding:24px 0}
.done .mark{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--ok)}
.done h1{margin:0 auto 10px}
.done p{color:var(--muted);max-width:50ch;margin:0 auto 26px}

.intro .note{font-size:.85rem;color:var(--muted);max-width:52ch;margin:-12px 0 20px}
footer.site{max-width:880px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.92rem}
footer.site a{color:var(--violet);font-weight:600}
.done .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.done a.btn{text-decoration:none;display:inline-block}
@media (max-width:680px){
  .panel{padding:22px}
  .intro{grid-template-columns:1fr}
  .intro-visual{max-width:200px;order:-1}
  dl.sum{grid-template-columns:1fr}
  dl.sum dt{border-bottom:0;padding-bottom:0}
  .others li{grid-template-columns:1fr 50px}
  .others .bar{grid-column:1 / -1;order:3}
}
/* Intro rings: rotation lives in CSS so the draw-in animation can spin them into place */
.intro-visual .arc{transform-box:view-box;transform-origin:100px 100px;transform:rotate(-90deg)}
.intro-visual .arc-a{--len:420}
.intro-visual .arc-b{--len:230}
@keyframes arc-draw{
  0%{stroke-dashoffset:var(--len);transform:rotate(-300deg);opacity:0}
  12%{opacity:1}
  100%{stroke-dashoffset:0;transform:rotate(-90deg);opacity:1}
}
@media (prefers-reduced-motion:no-preference){
  .ring circle.val{transition:stroke-dashoffset 900ms cubic-bezier(.2,.8,.2,1)}
  .intro-visual .arc{animation:arc-draw 1.8s cubic-bezier(.22,1,.36,1) both}
  .intro-visual .arc-b{animation-delay:.18s;animation-duration:1.6s}
}
</style>
</head>
<body>
<canvas id="bg-dots" aria-hidden="true"></canvas>
<header class="bar"><div class="bar-in">
  <div class="brand">ADA<span id="t-brandsub">Solution Finder</span></div>
</div></header>
<main id="app" aria-live="polite"></main>
<footer class="site"><span id="t-learn">Learn more about us:</span> <a href="https://adaglobal.com/" target="_blank" rel="noopener">adaglobal.com</a></footer>

<script>
/* ---------- Copy (EN / VI) ---------- */
const T={
en:{brandsub:"Solution Finder",learn:"Learn more about us:",visit:"Visit adaglobal.com",noteAll:"We record your answers anonymously to improve this tool. Your email is stored only if you ask a consultant to contact you.",noteEmail:"Your answers are stored only if you ask a consultant to contact you.",
 steps:["Your brand","Your needs","Confirm","Packages","Consultant"],
 introH:"Explore the ideal package for your enterprise",
 introP:"Answer a few questions about your channels, sales and goals. In about 3 minutes, you’ll get the packages that fit best, with an estimated monthly fee.",
 f1:"Questions",f1v:"11",f2:"Time",f2v:"≈ 3 min",f3:"Cost",f3v:"Free, no sign-up",
 start:"Get started",
 undH:"We understand what growing brands deal with",
 undP:"Most brands we talk to face at least one of these:",
 und:[["Too many channels to run","Shopee, Lazada, TikTok Shop and your own site each need daily attention."],
      ["Sales that don’t scale","Ads, livestreams and KOLs cost more each season, but growth slows."],
      ["Data in silos","Sales, ads and customer data sit in different places, so decisions take longer."],
      ["Unclear budget","It’s hard to know what a full-service partner should cost before the first call."]],
 undCTA:"Next",back:"Back",next:"Next",
 s1H:"About your brand",s1P:"This helps us size the right package.",
 s2H:"What you need",s2P:"Choose everything that applies.",
 qCat:"Product category",qCh:"Where do you sell today?",qGmv:"Current monthly online sales",qTgt:"Target monthly online sales in 12 months",qSku:"Number of products (SKUs)",
 qSvc:"Services you need",qLive:"Livestream sessions per month",qKol:"KOL / KOC support",qData:"Data and AI needs",qBud:"Monthly budget for these services",qStart:"When do you want to start?",
 multi:"(choose one or more)",req:"Choose an option to continue.",reqM:"Choose at least one option.",
 cfH:"Please check your answers",cfP:"Your packages are calculated from these answers.",edit:"Edit",
 cfOk:"My answers are correct.",cfErr:"Tick the box to confirm your answers.",see:"See my packages",
 rsTag:"Best match",rsOther:"Other options for you",match:"match",
 fee:"Estimated monthly fee",perM:"per month",inBud:"Within your budget",outBud:"Above your stated budget",
 disc:"Indicative estimate only. A consultant confirms the final price after scoping.",cont:"Continue",
 csH:"Would you like to talk to an ADA consultant?",csP:"A consultant can review your answers and prepare a tailored proposal.",
 csCheck:"Yes, I’d like a consultant to contact me.",email:"Your email",emailPh:"name@company.com",
 emailErr:"Enter a valid email so the consultant can reach you.",consent:"I agree that ADA may contact me about this request and store my answers for that purpose.",
 consentErr:"Tick the box so we can contact you.",finish:"Finish",
 doneH:"All done",doneYes:e=>`Thanks. A consultant will email you at ${e} within one working day.`,doneNo:"Thanks for using Solution Finder. You can come back any time to compare packages.",home:"Back to home"},
};
const O={ /* options: [id, label, legacy label – unused] */
 cat:[["fmcg","FMCG","FMCG"],["beauty","Beauty & personal care","Làm đẹp & chăm sóc cá nhân"],["fashion","Fashion","Thời trang"],["elec","Electronics","Điện tử"],["mom","Mother & baby","Mẹ & bé"],["fnb","Food & beverage","Thực phẩm & đồ uống"],["other","Other","Khác"]],
 ch:[["shopee","Shopee","Shopee"],["lazada","Lazada","Lazada"],["tiktok","TikTok Shop","TikTok Shop"],["tiki","Tiki","Tiki"],["web","Own website","Website riêng"],["offline","Offline only","Chỉ bán offline"]],
 gmv:[["0","Under 500M VND","Dưới 500 triệu"],["1","500M – 2B VND","500 triệu – 2 tỷ"],["2","2B – 10B VND","2 – 10 tỷ"],["3","Over 10B VND","Trên 10 tỷ"]],
 sku:[["0","Under 50","Dưới 50"],["1","50 – 200","50 – 200"],["2","200 – 1,000","200 – 1.000"],["3","Over 1,000","Trên 1.000"]],
 svc:[["ops","Store operations","Vận hành gian hàng"],["ads","Onsite ads","Quảng cáo trên sàn"],["live","Livestream","Livestream"],["kol","KOL / KOC & affiliate","KOL / KOC & affiliate"],["content","Content production","Sản xuất nội dung"],["cs","Customer service / chatbot","Chăm sóc khách hàng / chatbot"],["dash","Data dashboard","Dashboard dữ liệu"],["ful","Fulfilment","Kho vận"]],
 live:[["0","None","Không"],["4","4","4"],["8","8","8"],["16","16","16"]],
 kol:[["none","None","Không"],["koc","KOC affiliate","KOC affiliate"],["micro","Micro KOL","Micro KOL"],["macro","Macro KOL","Macro KOL"],["celeb","Celebrity","Người nổi tiếng"]],
 data:[["dashboard","Sales dashboard","Dashboard bán hàng"],["cdp","Customer data platform","Nền tảng dữ liệu khách hàng (CDP)"],["perso","Personalisation","Cá nhân hóa"],["cai","Conversational AI","AI hội thoại"],["none","Not yet","Chưa cần"]],
 bud:[["50","Under 50M VND","Dưới 50 triệu"],["150","50M – 150M VND","50 – 150 triệu"],["400","150M – 400M VND","150 – 400 triệu"],["9999","Over 400M VND","Trên 400 triệu"]],
 start:[["1","Within 1 month","Trong 1 tháng"],["3","Within 3 months","Trong 3 tháng"],["6","Within 6 months","Trong 6 tháng"],["99","Just exploring","Đang tìm hiểu"]]
};
/* Packages and prices = project assumptions (Inputs, Packages & Pricing tab). Million VND per month. */
const PK=[
 {id:"P1",lvl:0,ai:0,from:30,to:60,svc:["ops","ads"],liveInc:0,koc:false,dash:false,bot:false,
  en:{n:"Starter – Marketplace Launch",b:"For brands under 500M VND a month on 1–2 platforms.",inc:["Store set-up & operations","Product listing","Basic onsite ads","Monthly report"]}},
 {id:"P2",lvl:1,ai:0,from:80,to:150,svc:["ops","ads","live","kol"],liveInc:4,koc:true,dash:false,bot:false,
  en:{n:"Growth – Marketplace & Social Commerce",b:"For brands at 500M–2B VND a month on 2–3 platforms.",inc:["Everything in Starter","TikTok Shop","Ads optimisation","4 livestreams a month","KOC affiliate programme"]}},
 {id:"P3",lvl:2,ai:1,from:180,to:350,svc:["ops","ads","live","kol","content","dash"],liveInc:4,koc:true,dash:true,bot:false,
  en:{n:"Accelerate – Full-funnel Commerce & Data",b:"For brands at 2–10B VND a month or with several categories.",inc:["Everything in Growth","Content studio","KOL campaign management","Sales dashboard","CRM activation"]}},
 {id:"P4",lvl:3,ai:2,from:400,to:800,svc:["ops","ads","live","kol","content","dash","cs"],liveInc:4,koc:true,dash:true,bot:true,
  en:{n:"Enterprise – Data & AI Commerce",b:"For brands over 10B VND a month or needing a CDP or AI.",inc:["Everything in Accelerate","Customer data platform","Personalisation","Conversational AI","Custom scope"]}}
];

/* ---------- State ---------- */
let lang="en", screen="intro";
const A={cat:null,ch:[],gmv:null,tgt:null,sku:null,svc:[],live:"0",kol:"none",data:[],bud:null,start:null,confirmed:false,wants:false,email:"",consent:false};
const STEP_OF={s1:0,s2:1,confirm:2,results:3,consult:4};
const $=s=>document.querySelector(s);
const t=k=>T[lang][k];
const lbl=(group,id)=>{const o=O[group].find(x=>x[0]===id);return o?(lang==="en"?o[1]:o[2]):"";};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Scoring & pricing ---------- */
function compute(){
  const tier=+A.tgt;
  const platforms=A.ch.filter(c=>c!=="offline").length;
  const factor=(platforms>=3||+A.sku>=2)?1.2:1.0;
  const aiMods=A.data.filter(d=>["cdp","perso","cai"].includes(d)).length;
  const aiNeed=aiMods>=2?2:aiMods===1?1:0;
  const svcSel=A.svc.filter(s=>s!=="ful");
  const budget=+A.bud;
  const live=+A.live;
  return PK.map(p=>{
    let s=0;
    const d=Math.abs(p.lvl-tier); s+=[40,22,8,0][d];
    const platFit=p.lvl===0?(platforms<=2):p.lvl===1?(platforms>=1&&platforms<=3):(platforms>=2);
    s+=platFit?15:5;
    s+=svcSel.length?Math.round(20*svcSel.filter(x=>p.svc.includes(x)).length/svcSel.length):20;
    s+=p.ai===aiNeed?15:(p.ai>aiNeed?(p.ai-aiNeed===1?9:4):0);
    let fr=p.from,to=p.to;
    const extra=Math.max(0,live-p.liveInc); fr+=extra*8; to+=extra*15;
    if(A.kol==="koc"&&!p.koc){fr+=20;to+=50;}
    if(["micro","macro","celeb"].includes(A.kol)){fr+=50;to+=200;}
    if((A.svc.includes("cs")||A.data.includes("cai"))&&!p.bot){fr+=30;to+=80;}
    if((A.data.includes("dashboard")||A.svc.includes("dash"))&&!p.dash){fr+=15;to+=40;}
    fr=Math.round(fr*factor); to=Math.round(to*factor);
    const fits=budget>=fr;
    s+=fits?10:(budget>=fr*0.7?5:0);
    return {p,score:Math.max(5,Math.min(98,s)),from:fr,to,fits};
  }).sort((a,b)=>b.score-a.score);
}
const money=(m)=>lang==="en"
  ? (m>=1000?`${(m/1000).toLocaleString("en-US",{maximumFractionDigits:2})}B`:`${m.toLocaleString("en-US")}M`)
  : (m>=1000?`${(m/1000).toLocaleString("vi-VN",{maximumFractionDigits:2})} tỷ`:`${m.toLocaleString("vi-VN")} triệu`);
const range=(a,b)=>lang==="en"?`VND ${money(a)} – ${money(b)}`:`${money(a)} – ${money(b)} ₫`;

/* ---------- Logging to Google Sheet (Apps Script web app) ----------
   ENDPOINT: paste the Apps Script /exec URL after deploying. Empty = logging off.
   LOG_MODE: "all" = record every answer (pilot / acceptance);
             "email_only" = record answers only when the user leaves an email. */
const CONFIG={ENDPOINT:"",LOG_MODE:"all"};
const newId=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
let SID=newId();
const enL=(g,id)=>{const o=O[g].find(x=>x[0]===id);return o?o[1]:"";};
const enMany=(g,arr)=>arr.map(x=>enL(g,x)).join("; ");
function snapshot(event){
  const d={session_id:SID,event,lang,client_time:new Date().toISOString(),
    category:enL("cat",A.cat),channels:enMany("ch",A.ch),current_gmv:enL("gmv",A.gmv),target_gmv:enL("gmv",A.tgt),skus:enL("sku",A.sku),
    services:enMany("svc",A.svc),livestream:A.svc.includes("live")?enL("live",A.live):"",kol:enL("kol",A.kol),data_ai:enMany("data",A.data),
    budget:enL("bud",A.bud),start:enL("start",A.start)};
  if(A.tgt!==null&&A.bud!==null&&A.sku!==null){
    const R=compute(),top=R[0];
    Object.assign(d,{top_package:top.p.id,top_score:top.score,all_scores:R.map(r=>r.p.id+":"+r.score).join("|"),
      price_from_m:top.from,price_to_m:top.to,within_budget:top.fits?"yes":"no",qualified:(top.fits&&+A.start<=3)?"yes":"no"});
  }
  if(event==="lead"||event==="finish") d.consultant=A.wants?"yes":"no";
  if(event==="lead"){d.email=A.email;d.consent=A.consent?"yes":"no";}
  return d;
}
function log(event){
  if(!CONFIG.ENDPOINT) return;
  if(CONFIG.LOG_MODE==="email_only"&&event!=="lead") return;
  /* Body sent as text/plain (default for a string) so the browser skips the CORS pre-flight. */
  try{fetch(CONFIG.ENDPOINT,{method:"POST",body:JSON.stringify(snapshot(event)),keepalive:true}).catch(()=>{});}catch(e){}
}

/* ---------- Rendering helpers ---------- */
function stepsBar(){
  if(!(screen in STEP_OF)) return "";
  const n=STEP_OF[screen];
  return `<ol class="steps" aria-label="Progress">${t("steps").map((s,i)=>`<li class="${i<n?"done":i===n?"now":""}"${i===n?' aria-current="step"':""}>${i+1}. ${s}</li>`).join("")}</ol>`;
}
function chips(key,group,multi){
  const val=A[key];
  return `<div class="chips">${O[group].map(([id,en,vi])=>{
    const on=multi?val.includes(id):val===id;
    return `<button type="button" class="chip" data-key="${key}" data-id="${id}" data-multi="${multi?1:0}" aria-pressed="${on}">${esc(lang==="en"?en:vi)}</button>`;}).join("")}</div>`;
}
function q(key,group,label,multi,hide){
  return `<fieldset class="q${hide?" hidden":""}" id="q-${key}"><legend>${label}${multi?`<span class="hint">${t("multi")}</span>`:""}</legend>${chips(key,group,multi)}<div class="err" id="e-${key}"></div></fieldset>`;

/* ---------- Validation ---------- */
function need(key,multi){
  const ok=multi?A[key].length>0:A[key]!==null;
  const e=document.getElementById("e-"+key); if(e) e.textContent=ok?"":(multi?t("reqM"):t("req"));
  return ok;
}
function validate(step){
  if(step==="s1"){const r=["cat","ch","gmv","tgt","sku"].map(k=>need(k,k==="ch"));return r.every(Boolean);}
  if(step==="s2"){const r=[need("svc",true),need("kol"),need("data",true),need("bud"),need("start")];return r.every(Boolean);}
  if(step==="confirm"){A.confirmed=$("#cfok").checked;$("#e-cf").textContent=A.confirmed?"":t("cfErr");return A.confirmed;}
  if(step==="consult"){
    if(!A.wants) return true;
    A.email=$("#email").value.trim(); A.consent=$("#consent").checked;
    const okE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(A.email); const okC=A.consent;
    $("#e-email").textContent=okE?"":t("emailErr"); $("#e-consent").textContent=okC?"":t("consentErr");
    if(!okE) $("#email").focus(); return okE&&okC;
  }
  return true;
}
const NEXT={s1:"s2",s2:"confirm",confirm:"results",consult:"done"};
function go(s){screen=s;render();window.scrollTo({top:0});const h=$("#app h1, #app h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});}}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip");
  if(c){
    const k=c.dataset.key,id=c.dataset.id;
    if(c.dataset.multi==="1"){
      let arr=A[k];
      if(k==="data"&&id==="none") arr=arr.includes("none")?[]:["none"];
      else { arr=arr.filter(x=>x!=="none"); arr=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id]; }
      A[k]=arr;
      c.parentElement.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",A[k].includes(b.dataset.id)));
      if(k==="svc"){const lq=$("#q-live"); if(lq){lq.classList.toggle("hidden",!A.svc.includes("live")); if(!A.svc.includes("live")) A.live="0";}}
    } else {
      A[k]=id; c.parentElement.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===id));
    }
    const er=document.getElementById("e-"+k); if(er) er.textContent="";
    return;
  }
  const g=e.target.closest("[data-go]"); if(g){if(g.dataset.ev) log(g.dataset.ev); go(g.dataset.go);return;}
  const n=e.target.closest("[data-next]"); if(n){const s=n.dataset.next; if(validate(s)){
    if(s==="s1") log("brand_done"); else if(s==="s2") log("needs_done"); else if(s==="consult") log(A.wants?"lead":"finish");
    go(NEXT[s]);
    if(s==="confirm") log("results_shown");
  } return;}
  const r=e.target.closest("[data-reset]"); if(r){Object.assign(A,{cat:null,ch:[],gmv:null,tgt:null,sku:null,svc:[],live:"0",kol:"none",data:[],bud:null,start:null,confirmed:false,wants:false,email:"",consent:false});SID=newId();go("intro");log("page_view");return;}
});
document.addEventListener("change",e=>{
  if(e.target.id==="wants"){A.wants=e.target.checked;$("#more").classList.toggle("hidden",!A.wants); if(A.wants) setTimeout(()=>$("#email").focus(),0);}
  if(e.target.id==="cfok"){A.confirmed=e.target.checked; if(A.confirmed) $("#e-cf").textContent="";}
});
/* ---------- Dot-wave background ----------
   A dot grid warped by a slow wave field. Dots grow and brighten on the crests and
   fade in the troughs; colour runs violet → magenta like the brand gradient. */
(function(){
  const cv=$("#bg-dots"), ctx=cv&&cv.getContext("2d");
  if(!ctx) return;
  const still=matchMedia("(prefers-reduced-motion: reduce)");
  const BUCKETS=12;
  let W=0,H=0,gap=22,dark=false,cols=[],raf=0,last=0;
  const hex=v=>{v=v.trim().replace("#","");return [0,2,4].map(i=>parseInt(v.slice(i,i+2),16));};
  function readColors(){
    const s=getComputedStyle(document.documentElement);
    const a=hex(s.getPropertyValue("--violet")),b=hex(s.getPropertyValue("--magenta")),p=hex(s.getPropertyValue("--page"));
    dark=(p[0]*.299+p[1]*.587+p[2]*.114)<128;
    cols=[...Array(BUCKETS)].map((_,i)=>{const f=i/(BUCKETS-1);return `rgb(${a.map((c,j)=>Math.round(c+(b[j]-c)*f)).join(",")})`;});
  }
  function size(){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    W=innerWidth; H=innerHeight; gap=W<680?18:22;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function draw(t){
    const s=t*0.00022, amp=gap*0.7, base=dark?0.1:0.07, gain=dark?0.8:0.5, rMax=dark?1.7:1.5;
    ctx.clearRect(0,0,W,H);
    for(let y=-gap;y<H+gap;y+=gap){
      const ny=y/H;
      for(let x=-gap;x<W+gap;x+=gap){
        const nx=x/W;
        const h=Math.sin(nx*5.2+s*1.3+Math.sin(ny*3.1-s)*1.6)*Math.cos(ny*4.4-s*0.9+nx*1.7);
        const k=(h+1)/2, e=k*k*(3-2*k);
        ctx.globalAlpha=base+e*e*gain;
        ctx.fillStyle=cols[Math.max(0,Math.min(BUCKETS-1,Math.floor((nx*0.7+ny*0.3)*BUCKETS)))];
        ctx.beginPath();
        ctx.arc(x+Math.cos(ny*6+s)*amp*h, y+Math.sin(nx*6-s)*amp*h, 0.45+e*rMax, 0, 6.2832);
        ctx.fill();
      }
    }
  }
  /* ~30 fps is plenty for a slow drift and keeps the page light */
  function loop(t){raf=requestAnimationFrame(loop); if(t-last<33) return; last=t; draw(t);}
  function start(){cancelAnimationFrame(raf); if(still.matches||document.hidden){draw(0);return;} raf=requestAnimationFrame(loop);}
  readColors(); size(); start();
  let pending=0;
  addEventListener("resize",()=>{cancelAnimationFrame(pending);pending=requestAnimationFrame(()=>{size();if(still.matches)draw(0);});});
  document.addEventListener("visibilitychange",start);
  still.addEventListener("change",start);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{readColors();if(still.matches)draw(0);});
})();

render();
log("page_view");
</script>
